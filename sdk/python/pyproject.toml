[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qualyx-client"
version = "0.1.1"
description = "Standard-library client for Qualyx HTTP API v1"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"

[tool.setuptools]
py-modules = ["qualyx_client"]

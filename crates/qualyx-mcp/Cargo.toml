[package]
name = "qualyx-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
qualyx-app.workspace = true
qualyx-core.workspace = true
qualyx-discovery.workspace = true
qualyx-runners.workspace = true
qualyx-store.workspace = true
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
toml = "1.1.8"

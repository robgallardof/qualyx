<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qualyx</title>
  <style>
    :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e3e6; --ok: #1a7f37; --bad: #c62828; --warn: #8a6100; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151517; --fg: #ededf0; --muted: #a0a0a8; --line: #2c2c30; --ok: #4ac26b; --bad: #ff6b6b; --warn: #e3b341; } }
    body { margin: 0; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    input { flex: 1 1 240px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
    button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    .passed { color: var(--ok); } .failed, .error { color: var(--bad); } .inconclusive { color: var(--warn); }
    #msg { color: var(--muted); min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Qualyx runs</h1>
    <form id="f">
      <input id="project" aria-label="Project path" placeholder="Project path (under an allowed root)" required>
      <input id="token" aria-label="API token" type="password" autocomplete="off" placeholder="API token (kept in this tab only)">
      <button id="load">Load</button>
    </form>
    <p id="msg" role="status" aria-live="polite"></p>
    <table>
      <thead><tr><th>Run</th><th>Status</th><th>Passed</th><th>Failed</th><th>Total</th><th>Started</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    // Read-only API view. Remember credentials only for this tab; send them in the header.
    const $ = (id) => document.getElementById(id);
    try { $("token").value = sessionStorage.getItem("qualyx-token") || ""; } catch (_) {}
    $("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = $("token").value;
      try { sessionStorage.setItem("qualyx-token", token); } catch (_) {}
      $("msg").textContent = "Loading…";
      $("load").disabled = true;
      $("rows").replaceChildren();
      try {
        const r = await fetch("/v1/runs?project=" + encodeURIComponent($("project").value), {
          headers: token ? { Authorization: "Bearer " + token } : {},
          signal: AbortSignal.timeout(15000),
          redirect: "error",
        });
        const body = await r.json();
        if (!r.ok) { $("msg").textContent = body.error || r.statusText; $("rows").replaceChildren(); return; }
        const runs = body.runs || (body.jobs || []).map((job) => ({
          run_id: job.run_id,
          status: job.manifest?.status || job.state,
          passed: job.manifest?.counts?.passed ?? "—",
          failed: job.manifest?.counts?.failed ?? "—",
          total: job.manifest?.counts?.total ?? "—",
          started_at: job.manifest?.started_at || "—",
        }));
        $("msg").textContent = runs.length === 0 ? "No runs found for this project." :
          runs.length + " run(s) shown · " + (body.in_flight || []).length + " in flight";
        $("rows").replaceChildren(...runs.map((run) => {
          const tr = document.createElement("tr");
          for (const [v, cls] of [[run.run_id], [run.status, run.status], [run.passed], [run.failed], [run.total], [run.started_at]]) {
            const td = document.createElement("td");
            td.textContent = v;
            if (cls) td.className = cls;
            tr.append(td);
          }
          return tr;
        }));
      } catch (_) {
        $("msg").textContent = "Could not load runs. Check the API connection and try again.";
      } finally {
        $("load").disabled = false;
      }
    });
  </script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # M1 gate: clean checkout -> install -> run -> report on all three OSes,
  # with the real native toolchains the fixtures need.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==8.3.5
      - run: cargo test --workspace --locked
        env:
          # Linux runners have a Linux container engine; Windows/macOS runners don't.
          QUALYX_TEST_DOCKER: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      - name: Allow the Chrome sandbox on Ubuntu 24.04 (AppArmor userns restriction)
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Playwright browsers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx -y playwright@1.64.1 install --with-deps chromium
      - name: Enable safaridriver (macOS)
        if: matrix.os == 'macos-latest'
        run: sudo safaridriver --enable
      - name: Real browsers (installed on the runner image)
        run: cargo test --locked -p qualyx-browser --test real_browsers -- --nocapture
        env:
          QUALYX_TEST_BROWSERS: "1"
      - name: Playwright runner (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p qualyx-cli --test fixtures playwright
        env:
          QUALYX_TEST_PLAYWRIGHT: "1"
      - name: Smoke test the built binary
        shell: bash
        run: |
          cargo build --locked -p qualyx-cli
          ./target/debug/qualyx doctor fixtures/python/passing
          ./target/debug/qualyx discover fixtures/node/failing --json

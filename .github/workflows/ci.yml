name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The console is a Next.js static export committed under crates/qualyx-api/dashboard so
  # cargo builds never need Node. Build it here and fail if the committed copy is stale.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx next build --webpack
      # Webpack chunk hashes vary by OS, so compare the recorded source hash, not the bytes.
      - name: Embedded export matches the sources
        run: node scripts/embed.mjs --check

  # M1 gate: clean checkout -> install -> run -> report on all three OSes,
  # with the real native toolchains the fixtures need.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==8.3.5
      - name: Python SDK real HTTP regressions
        run: python -m unittest discover -s sdk/python/tests -v
      - name: Package documentation regressions
        run: python -m unittest discover -s scripts/tests -v
      - run: cargo test --workspace --locked
        env:
          # Linux runners have a Linux container engine; Windows/macOS runners don't.
          QUALYX_TEST_DOCKER: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      - name: Allow the Chrome sandbox on Ubuntu 24.04 (AppArmor userns restriction)
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Team PostgreSQL migrations and project isolation (real container)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p qualyx-cli --test team shared_postgres_index -- --ignored --nocapture
      - name: Durable team workers and signed S3 evidence (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/test_team.py
      - name: Playwright browsers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx -y playwright@1.64.1 install --with-deps chromium
      - name: Enable safaridriver (macOS)
        if: matrix.os == 'macos-latest'
        run: sudo safaridriver --enable
      - name: Real browsers (installed on the runner image)
        # Safari permits one WebDriver session at a time. Keep the full browser matrix,
        # but serialize these tests so they cannot compete for the same browser instance.
        run: cargo test --locked -p qualyx-browser --test real_browsers -- --nocapture --test-threads=1
        env:
          QUALYX_TEST_BROWSERS: "1"
      - name: Playwright runner (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p qualyx-cli --test fixtures playwright
        env:
          QUALYX_TEST_PLAYWRIGHT: "1"
      - name: Accessibility CLI against seeded page (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p qualyx-cli --test quality a11y_command_reports_seeded_violations -- --nocapture
        env:
          QUALYX_TEST_BROWSERS: "1"
      - name: Dashboard real browser recovery (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p qualyx-cli --test team dashboard_recovers -- --ignored --nocapture
      - name: Smoke test the built binary
        shell: bash
        run: |
          cargo build --locked -p qualyx-cli
          ./target/debug/qualyx doctor fixtures/python/passing
          ./target/debug/qualyx discover fixtures/node/failing --json
      - name: Extracted package installation smoke
        run: python scripts/package.py --binary target/debug/qualyx${{ runner.os == 'Windows' && '.exe' || '' }} --target ${{ runner.os }}

  team-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: docker build -t qualyx:team .
      - run: python scripts/test_team_compose.py

  # M5 gate: seeded performance regression and seeded vulnerabilities detected with real
  # tools; unsafe targets blocked. Tools are pinned and verified against release checksums.
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned k6, Gitleaks, OSV-Scanner, Trivy, Semgrep
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          fetch() { curl -sSfL -o "$2" "$1"; echo "$3  $2" | sha256sum -c -; }
          fetch https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz k6.tgz 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
          tar -xzf k6.tgz --strip-components=1
          fetch https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz gitleaks.tgz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          tar -xzf gitleaks.tgz gitleaks
          fetch https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 osv-scanner 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          fetch https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz trivy.tgz c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          tar -xzf trivy.tgz trivy
          chmod +x k6 gitleaks osv-scanner trivy
          python -m pip install -q semgrep==1.182.1
          python -m pip install -q schemathesis==4.32.5
          echo "$HOME/tools" >> "$GITHUB_PATH"
      - name: Install cargo-mutants (pinned)
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: docker pull ghcr.io/zaproxy/zaproxy:stable
      - run: cargo test --locked -p qualyx-perf -p qualyx-security -- --nocapture --test-threads=1
        env:
          QUALYX_TEST_K6: "1"
          QUALYX_TEST_SCANNERS: "1"
          QUALYX_TEST_ZAP: "1"
      - name: Quality depth (mutation, contract, compose)
        run: cargo test --locked -p qualyx-cli --test quality -- --nocapture --test-threads=2
        env:
          QUALYX_TEST_MUTANTS: "1"
          QUALYX_TEST_SCHEMATHESIS: "1"
          QUALYX_TEST_DOCKER: "1"
      - name: Security audit CLI with real scanners and reviewed suppressions
        run: cargo test --locked -p qualyx-cli --test security_audit -- --ignored --nocapture

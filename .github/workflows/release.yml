name: Release packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: qualyx
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: qualyx.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: qualyx
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==8.3.5
      - run: cargo build --locked --release -p qualyx-cli --target ${{ matrix.target }}
      - name: Package and smoke-test the extracted installation
        run: python scripts/package.py --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --target ${{ matrix.target }}
      - name: Dependency inventory
        shell: bash
        run: cargo metadata --locked --format-version 1 > artifacts/release/cargo-metadata-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v6
        with:
          name: qualyx-${{ matrix.target }}
          path: artifacts/release/*
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: qualyx-*
          merge-multiple: true
          path: packages
      - name: Create a draft for human review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" packages/* --draft --verify-tag --generate-notes

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robgallardof/qualyx"
authors = ["Roberto Gallardo"]

[workspace.dependencies]
qualyx-core = { path = "crates/qualyx-core" }
qualyx-discovery = { path = "crates/qualyx-discovery" }
qualyx-runners = { path = "crates/qualyx-runners" }
qualyx-store = { path = "crates/qualyx-store" }
qualyx-app = { path = "crates/qualyx-app" }
qualyx-mcp = { path = "crates/qualyx-mcp" }
qualyx-impact = { path = "crates/qualyx-impact" }
qualyx-scheduler = { path = "crates/qualyx-scheduler" }
qualyx-llm = { path = "crates/qualyx-llm" }
qualyx-triage = { path = "crates/qualyx-triage" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
